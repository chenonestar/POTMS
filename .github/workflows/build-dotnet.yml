name: 构建 .NET 版 Windows 包

on:
  push:
    branches: [claude/dotnet-version, main]
    paths: ['potms-dotnet/**', '.github/workflows/build-dotnet.yml', 'database.py']
  pull_request:
    paths: ['potms-dotnet/**', 'database.py']
  workflow_dispatch:

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    outputs:
      own_changes: ${{ steps.scope.outputs.own }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 要与推送前的提交比对改动范围

      # database.py 在触发路径里，是为了守住 Schema.cs 与源头同步——那是**测试**
      # 关切。但只改了 Python 版时，本版代码一个字没动，重打一份一模一样的
      # Windows 包没有意义。这里判断本次改动有没有落到本版自己的目录，
      # 没有就只跑校验与测试，跳过打包。
      - name: 判断本次改动是否涉及本版
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "own=true" >> "$GITHUB_OUTPUT"; echo "非 push 事件，照常打包"; exit 0
          fi
          # 新分支首推时 before 是全零；force push 后旧提交也可能取不到
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "own=true" >> "$GITHUB_OUTPUT"; echo "取不到基线提交，保守起见照常打包"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "$changed"
          if echo "$changed" | grep -qE '^(potms-dotnet/|\.github/workflows/build-dotnet\.yml$)'; then
            echo "own=true" >> "$GITHUB_OUTPUT"; echo "本版有改动，打包"
          else
            echo "own=false" >> "$GITHUB_OUTPUT"; echo "本版无改动（多半只动了 database.py），跳过打包"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Schema.cs 由 Python 版 database.py 生成，四版共用 data.db，
      # 此处校验生成物未与源头脱节
      - name: 校验 Schema.cs 与 database.py 同步
        run: python3 potms-dotnet/tools/gen-schema.py --check

      - name: 还原依赖
        run: dotnet restore potms-dotnet/POTMS.sln

      - name: 构建
        run: dotnet build potms-dotnet/POTMS.sln -c Release --no-restore

      - name: 单元测试
        run: dotnet test potms-dotnet/POTMS.sln -c Release --no-build --verbosity normal

  build-windows:
    name: 构建 Windows 自包含包
    needs: test
    # 只动了 database.py 时不重打包——本版代码没变，产物会和上次一模一样。
    # 发版走 release.yml，那条无论如何都会把五版一起构建。
    if: needs.test.outputs.own_changes == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 自包含发布为「目录」而非单文件：
      # 不裁剪（裁剪会破坏 Razor 依赖的反射），不打单文件（避免原生库释放到 temp）
      - name: 发布
        run: >
          dotnet publish potms-dotnet/src/POTMS/POTMS.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishTrimmed=false -p:PublishSingleFile=false
          -o dist/POTMS-dotnet

      - name: 附带说明文件
        shell: bash
        run: cp potms-dotnet/README.md dist/POTMS-dotnet/README.md

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: POTMS-dotnet-windows-x64
          path: dist/POTMS-dotnet
          retention-days: 30
