name: 构建 Java 版 Windows 包

on:
  push:
    branches: [claude/java-version, main]
    paths: ['potms-java/**', '.github/workflows/build-java.yml', 'database.py']
  pull_request:
    paths: ['potms-java/**', 'database.py']
  workflow_dispatch:

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 刻意用 Temurin：Oracle JDK 的 NFTC 免费窗口到期后需 Java SE Universal
      # Subscription（按企业总员工数计费）。详见 potms-java/README.md 许可证一节。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # schema.sql / Schema.java 由 Python 版 database.py 生成，五版共用 data.db，
      # 此处校验生成物未与源头脱节
      - name: 校验 schema 与 database.py 同步
        run: python3 potms-java/tools/gen-schema-java.py --check

      # 签名板那类「渲染出来才算数」的东西只有真开浏览器才测得到。runner 自带
      # Chrome，这里显式确认一下：缺了浏览器测试会自动跳过，不查就会在毫不知情
      # 的情况下丢掉唯一一层浏览器级验证。
      - name: 确认 CI 上有浏览器
        run: |
          test -x /usr/bin/google-chrome || {
            echo '::error::runner 上找不到 google-chrome，浏览器级签名测试会被静默跳过'; exit 1; }
          /usr/bin/google-chrome --version

      - name: 构建
        run: mvn -B -f potms-java/pom.xml package -DskipTests

      # 全站冒烟会起真进程走真 HTTP，须先有 target/potms.jar
      - name: 测试
        run: mvn -B -f potms-java/pom.xml test

  build-windows:
    name: 构建 Windows 包
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包胖 jar
        run: mvn -B -f potms-java/pom.xml package -DskipTests

      # jlink 只挑用得上的模块，把运行时压到 ~50MB
      - name: 裁剪运行时（jlink）
        shell: bash
        run: |
          jlink --add-modules java.base,java.desktop,java.sql,java.naming,java.management,\
          java.instrument,java.security.jgss,java.security.sasl,java.xml,java.xml.crypto,\
          java.logging,java.net.http,java.prefs,java.scripting,java.transaction.xa,\
          jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output runtime

      # --description 会写进 exe 的版本资源 FileDescription，也就是任务管理器里
      # 显示的那个程序名。它**不能直接写在命令行上**：JDK 启动器是按系统 ANSI
      # 代码页解码 argv 的，GitHub 的 windows runner 是 en-US（ACP=1252），
      # 中文到不了 jpackage 手里，全变成问号。实测对照：
      #   直接传参  --name 名称探针  →  jpackage 收到 ������������
      #   @参数文件 --name 名称探针  →  jpackage 收到 名称探针
      # 参数文件是 jpackage 自己用默认字符集（JDK 18+ 恒为 UTF-8）读的，
      # 绕开了 argv 那道解码，所以中文写进文件里传。
      - name: 准备 jpackage 参数文件（UTF-8）
        shell: bash
        run: |
          printf -- '--description\n"因私出国（境）人员审批管理系统"\n' > jpackage-args.txt

      # 目录版而非 exe 安装包：政务终端常无管理员权限，解压即用最稳妥。
      # --win-console 让启动器带控制台窗口，与 Go / Rust / .NET 三版一致：
      # 默认的窗口子系统启动器双击后毫无反应（Web 服务在后台起来了但看不见），
      # 用户会以为没启动而反复双击。
      - name: 生成免装 JRE 的目录版（jpackage）
        shell: bash
        run: |
          jpackage --type app-image \
            --name POTMS \
            --app-version 1.0.0 \
            --vendor POTMS \
            @jpackage-args.txt \
            --input potms-java/target \
            --main-jar potms.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --runtime-image runtime \
            --win-console \
            --java-options "-Dfile.encoding=UTF-8" \
            --dest dist

      # 从成品 exe 里把版本资源读回来核对。参数文件只保证中文安全抵达 jpackage，
      # 至于它写进 Windows 版本资源时会不会再掉一次，只有在 Windows 上读回来才知道。
      - name: 核对任务管理器里显示的程序名
        shell: pwsh
        run: |
          $info = (Get-Item dist\POTMS\POTMS.exe).VersionInfo
          Write-Host "FileDescription = $($info.FileDescription)"
          if ($info.FileDescription -notlike '*因私出国*') {
            throw "exe 版本资源里的中文没写对（任务管理器会显示成问号）：$($info.FileDescription)"
          }

      - name: 附带说明与备用胖 jar
        shell: bash
        run: |
          cp potms-java/README.md dist/POTMS/README.md
          cp potms-java/target/potms.jar dist/POTMS/potms-fatjar.jar
          du -sh dist/POTMS

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: POTMS-java-windows-x64
          path: dist/POTMS
          retention-days: 30
