spring.application.name=POTMS
# 会话滑动超时，与其它四版一致的 30 分钟
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=potms_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 上传限制 20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# 静态资源必须挂在 /static/** 下。
# Spring Boot 默认把 classpath:/static/ 映射到 /**，也就是 /css/style.css；
# 而五版共用同一套模板与 URL，模板里写的是 Flask 约定的 /static/css/style.css，
# 不改这一行的话所有 CSS/JS 全部 404，页面退化成无样式的裸 HTML。
spring.mvc.static-path-pattern=/static/**
# JTE：开发期热加载，打包后走预编译类
gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true
logging.level.root=WARN
logging.level.com.potms=INFO
